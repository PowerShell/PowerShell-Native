[package]
name = "powershell-native-windows"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
build = "build.rs"
publish = false

[lints]
workspace = true

[lib]
name = "powershell_native_host"

[[bin]]
name = "powershell"
path = "src/main.rs"

[features]
default = ["coreclr"]
coreclr = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Data_Xml_MsXml",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Urlmon",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
